camera:
  source: 0
  backend: picamera2
  px_to_cm_ratio: 0.0  # legacy fallback; ratio calibration is preferred
model:
  path: models/goldfish_finetuned_best.pt
  imgsz: 416
  conf: 0.4
  iou: 0.45
  tracker: bytetrack.yaml
pipeline:
  fps_ref: 14.0
  activity_window: 28
  speed_max_px_s: 700.0
  speed_min_px_s: 0.0
  min_track_frames: 8
  expected_fish_count: 2
zone:
  top_ratio: 0.3
  bottom_ratio: 0.7
sensor:
  mode: serial
  port: /dev/ttyACM0
  baudrate: 115200
  timeout_sec: 1.0
  send_interval_hz: 0.1
  sample_count: 10
  value4_type: tds_ppm
  backend_turbidity_compat: false
water_quality:
  temperature_c:
    min: 21.0
    max: 24.0
    actuator_heat_on: 21.5
    actuator_heat_off: 24.0
    actuator_cool_on: 24.0
    actuator_cool_off: 23.0
  ph:
    min: 6.5
    max: 8.0
    optimal_min: 7.4
    optimal_max: 7.5
  do_mg_l:
    min: 5.0
    max: 8.0
    critical_min: 4.0
  tds_ppm:
    monitor_only: true
    display_unit: ppm
lighting:
  day_hours: 8
  on_hour: 8
  off_hour: 16
growth_stage:
  fry:
    length_max_cm: 3.0
    feed_ratio: 0.1
    meals_per_day: 3
  juvenile:
    length_min_cm: 3.0
    length_max_cm: 7.0
    feed_ratio: 0.03
    meals_per_day: 3
  adult:
    length_min_cm: 7.0
    feed_ratio: 0.01
    meals_per_day: 2
feeding:
  complete_within_sec: 60
  leftover_check_sec: 300
  max_daily_meals: 5
  times:
  - 08:00
  - '18:00'
  tolerance_sec: 30
  allow_early_trigger: false
  overfeeding_by_turbidity_enabled: false
analytics:
  frs:
    version: v2
    activity_weight: 0.7
    latency_weight: 0.3
    before_sec: 300.0
    during_sec: 300.0
    activity_full_response_pct: 50.0
    latency_max_sec: 300.0
    baseline_csv: data/activity_baseline_v2.csv
    quality_expected_fish_count: 2
    min_pre_bins: 24
    min_post_bins: 24
    zone_component_used: false
    fps_ref: 14.0
    amount_advisor_enabled: false
  abr:
    version: v2
    window_sec: 300
    baseline_low_quantile: 0.01
    baseline_high_quantile: 0.99
    warning_pct: 13.0
  detection:
    missing_frame_threshold: 10
    iou_overlap_threshold: 0.0
    representative_lost_sec: 5.0
  activity_v2:
    enabled: true
    baseline_csv: data/activity_baseline_v2.csv
    bucket_sec: 5
    min_frames_per_bin: 10
    quality_expected_fish_count: 2
    index_clip_max: 250
    abr_window_sec: 300
    abr_min_bins: 12
    abr_warning_pct: 13.0
    quality_window_sec: 600
ai_control:
  enabled: true
  light_rest:
    enabled: true
    abr_threshold_pct: 13.0
    consecutive_alerts: 2
    rest_minutes: 20
    cooldown_minutes: 30
    allowed_quality:
    - GOOD
    - FAIR
    require_schedule_on: true
    decision_log_csv: data/presentation/ai_control_decisions.csv

server:
  enabled: true
  mock: false
  event_log_enabled: false
  send_fields:
  - timestamp
  - fish_count
  - avg_speed
  - top_ratio
  - anomaly_flag
  - frs_score
  - activity_level
  - feeding_state
storage:
  output_dir: data
  flush_every: 30
  baseline_csv: data/activity_baseline.csv
  feeding_events_csv: data/feeding_events.csv
  baseline_v2_csv: data/activity_baseline_v2.csv
  frs_history_csv: data/frs_history.csv
growth_prediction:
  enabled: true
  measurement_mode: tank_ratio
  reference_real_length_cm: 30.0
  reference_length_px: 0.0  # set after measuring visible tank inner width in the fixed camera view
  expected_fish_count: 2
  measurement_field: bbox_long_side_px
  allow_size_index_fallback: false
  min_records: 7
  min_span_days: 7.0
  fit_aggregation_days: 1.0
  history_csv: data/growth_records.csv
  result_csv: data/growth_prediction.csv
  holdout_ratio: 0.2
  confidence_interval_z: 1.96
  min_l_inf_cm: 8.0
  max_l_inf_cm: 40.0
  default_l_inf_cm: 20.0
  max_daily_growth_cm: 0.3
  max_measurement_jump_cm: 1.0
  aggregation_window_sec: 3600
  min_samples_per_record: 30
  aggregation_quantile: 0.5
  max_overlap_iou: 0.15
  stable_id_max_lost_sec: 10.0
  stable_id_max_distance_px: 120.0
