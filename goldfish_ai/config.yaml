camera:
  source: 0
  backend: picamera2
  px_to_cm_ratio: 0.0
model:
  path: models/goldfish_finetuned_best.pt
  imgsz: 416
  conf: 0.4
  iou: 0.45
  tracker: bytetrack.yaml
pipeline:
  fps_ref: 14.0
  activity_window: 28
  speed_max_px_s: 700.0
  speed_min_px_s: 0.0
  min_track_frames: 8
  expected_fish_count: 2
zone:
  top_ratio: 0.3
  bottom_ratio: 0.7
sensor:
  mode: serial
  port: /dev/ttyACM0
  baudrate: 115200
  timeout_sec: 1.0
  send_interval_hz: 0.1
  sample_count: 10
water_quality:
  temperature_c:
    min: 21.0
    max: 24.0
    actuator_heat_on: 21.5
    actuator_heat_off: 24.0
    actuator_cool_on: -999.0
    actuator_cool_off: 999.0
  ph:
    min: 6.5
    max: 8.0
    optimal_min: 7.4
    optimal_max: 7.5
  do_mg_l:
    min: 5.0
    max: 8.0
    critical_min: 4.0
    actuator_on: 6.0
    actuator_off: 8.0
  turbidity_ntu:
    max: 50.0
    stress_level: 100.0
    actuator_filter_on: 50.0
    actuator_filter_off: 20.0
lighting:
  day_hours: 8
  on_hour: 8
  off_hour: 16
growth_stage:
  fry:
    length_max_cm: 3.0
    feed_ratio: 0.1
    meals_per_day: 3
  juvenile:
    length_min_cm: 3.0
    length_max_cm: 7.0
    feed_ratio: 0.03
    meals_per_day: 3
  adult:
    length_min_cm: 7.0
    feed_ratio: 0.01
    meals_per_day: 2
feeding:
  complete_within_sec: 60
  leftover_check_sec: 300
  overfeeding_delta_ntu: 10.0
  max_daily_meals: 5
  times:
  - 08:00
  - '18:00'
  tolerance_sec: 30
  allow_early_trigger: false
analytics:
  frs:
    w1: 0.33
    w2: 0.33
    w3: 0.34
    before_sec: 60.0
    during_sec: 180.0
    amount_history_size: 3
    min_pre_coverage_ratio: 0.8
    min_post_coverage_ratio: 0.8
    min_detected_fish_ratio: 0.5
    min_frame_rate_ratio: 0.35
  abr:
    sigma_threshold: 2.0
    baseline_days: 3
  detection:
    missing_frame_threshold: 10
    iou_overlap_threshold: 0.0
    representative_lost_sec: 5.0
turbidity_feedback:
  alpha: 0.5
  eta: 0.8
  k: 2.0
server:
  enabled: true
  mock: false
  event_log_enabled: false
  send_fields:
  - timestamp
  - fish_count
  - avg_speed
  - top_ratio
  - anomaly_flag
  - frs_score
  - activity_level
  - feeding_state
storage:
  output_dir: data
  flush_every: 30
  baseline_csv: data/activity_baseline.csv
  feeding_events_csv: data/feeding_events.csv
growth_prediction:
  enabled: true
  expected_fish_count: 2
  measurement_field: bbox_long_side_px
  allow_size_index_fallback: false
  min_records: 7
  min_span_days: 7.0
  fit_aggregation_days: 1.0
  history_csv: data/growth_records.csv
  result_csv: data/growth_prediction.csv
  holdout_ratio: 0.2
  confidence_interval_z: 1.96
  min_l_inf_cm: 8.0
  max_l_inf_cm: 40.0
  default_l_inf_cm: 20.0
  max_daily_growth_cm: 0.3
  max_measurement_jump_cm: 1.0
  aggregation_window_sec: 3600
  min_samples_per_record: 30
  aggregation_quantile: 0.75
  max_overlap_iou: 0.15
  stable_id_max_lost_sec: 10.0
  stable_id_max_distance_px: 120.0
