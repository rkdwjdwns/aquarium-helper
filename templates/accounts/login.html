{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/accounts/login.css' %}">
{% endblock %}

{% block content %}
<div style="padding:30px 18px">
  <div class="auth-card">
    <h2 class="auth-title">환영합니다! 🐟</h2>
    <p class="auth-sub">어항 상태를 확인하러 가볼까요?</p>

    {% if messages %}
      {% for message in messages %}
      <div class="error-msg">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="auth-field">
        <label class="auth-label">아이디</label>
        <input type="text" name="username" class="auth-input" placeholder="아이디를 입력하세요" required>
      </div>
      <div class="auth-field">
        <label class="auth-label">비밀번호</label>
        <input type="password" name="password" class="auth-input" placeholder="비밀번호를 입력하세요" required>
      </div>
      <div class="check-row">
        <input type="checkbox" name="remember_me" id="remember_me" style="width:16px;height:16px;cursor:pointer">
        <label for="remember_me" style="font-size:14px;color:#737373;cursor:pointer">로그인 정보 저장</label>
      </div>
      <button type="submit" class="auth-btn">로그인</button>
    </form>

    <div class="auth-footer">
      처음이신가요? <a href="{% url 'accounts:signup' %}">회원가입</a>
    </div>
  </div>
</div>
{% endblock %}
