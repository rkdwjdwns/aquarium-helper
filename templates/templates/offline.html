<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오프라인 - 어항 도우미</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>body { font-family: "Pretendard", sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">
    <div class="text-center">
        <p class="text-7xl mb-6">🐠</p>
        <h1 class="text-2xl font-black text-slate-800 mb-3">인터넷 연결이 없어요</h1>
        <p class="text-slate-400 font-bold text-sm mb-8">
            네트워크 연결을 확인하고 다시 시도해주세요.
        </p>
        <button onclick="location.reload()"
                class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-black text-sm hover:bg-blue-700 transition-colors">
            다시 시도
        </button>
    </div>
</body>
</html>
