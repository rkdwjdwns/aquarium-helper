{% extends 'base.html' %}
{% block extra_css %}
<style>
  .auth-card{
    max-width:480px;margin:60px auto;background:#fff;
    border-radius:30px;padding:50px 48px;
    box-shadow:0 10px 13px rgba(0,0,0,.25);
  }
  .auth-title{font-size:30px;font-weight:900;letter-spacing:-1.5px;text-align:center;margin-bottom:8px}
  .auth-sub{color:#737373;font-size:15px;text-align:center;margin-bottom:36px}
  .auth-label{display:block;font-size:14px;font-weight:800;color:#252d3b;margin-bottom:7px}
  .auth-input{
    width:100%;height:50px;padding:0 18px;
    border:1.5px solid #dde1ea;border-radius:14px;
    font-size:15px;outline:none;font-family:inherit;
    transition:border-color .2s;
  }
  .auth-input:focus{border-color:#536ae8}
  .auth-field{margin-bottom:22px}
  .auth-btn{
    width:100%;height:56px;border:0;border-radius:30px;
    background:#263f50;color:#fff;font-size:17px;
    font-weight:900;cursor:pointer;margin-top:10px;
  }
  .auth-btn:hover{background:#1d3040}
  .auth-footer{text-align:center;margin-top:28px;color:#737373;font-size:14px}
  .auth-footer a{color:#536ae8;font-weight:800;text-decoration:none}
  .error-msg{background:#fef2f2;color:#dc2626;border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:18px}
  .check-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
</style>
{% endblock %}

{% block content %}
<div style="padding:30px 18px">
  <div class="auth-card">
    <h2 class="auth-title">환영합니다! 🐟</h2>
    <p class="auth-sub">어항 상태를 확인하러 가볼까요?</p>

    {% if messages %}
      {% for message in messages %}
      <div class="error-msg">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="auth-field">
        <label class="auth-label">아이디</label>
        <input type="text" name="username" class="auth-input" placeholder="아이디를 입력하세요" required>
      </div>
      <div class="auth-field">
        <label class="auth-label">비밀번호</label>
        <input type="password" name="password" class="auth-input" placeholder="비밀번호를 입력하세요" required>
      </div>
      <div class="check-row">
        <input type="checkbox" name="remember_me" id="remember_me" style="width:16px;height:16px;cursor:pointer">
        <label for="remember_me" style="font-size:14px;color:#737373;cursor:pointer">로그인 정보 저장</label>
      </div>
      <button type="submit" class="auth-btn">로그인</button>
    </form>

    <div class="auth-footer">
      처음이신가요? <a href="{% url 'accounts:signup' %}">회원가입</a>
    </div>
  </div>
</div>
{% endblock %}
