{% extends 'base.html' %}
{% block extra_css %}
<style>
  .settings-card{max-width:1160px;margin:40px auto;background:#fff;border-radius:34px;padding:42px 26px 70px;min-height:600px}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;padding:0 24px;margin-bottom:0}
  .tank-title{font-size:34px;font-weight:900;letter-spacing:-2px}
  .head-actions{display:flex;gap:16px}
  .head-btn{height:40px;min-width:84px;border-radius:11px;font-size:14px;cursor:pointer;font-weight:800}
  .cancel-btn{background:#fff;border:1px solid #222;color:#222;box-shadow:0 3px 5px rgba(0,0,0,.2)}
  .save-btn{background:#536ae8;border:0;color:#fff;min-width:104px;box-shadow:0 3px 5px rgba(0,0,0,.2)}
  .section{margin-top:60px}
  .section-title{margin:0 16px 26px;font-size:17px;font-weight:900;color:#444}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
  .setting-box{background:#edf3f8;border-radius:28px;padding:20px 18px;min-height:120px;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
  .setting-box label{display:block;margin-bottom:20px;font-size:12px;font-weight:800;color:#666;text-transform:uppercase}
  .setting-box input[type="number"],.setting-box input[type="text"],.setting-box input[type="time"]{
    width:100%;height:30px;border:0;border-radius:8px;background:#fff;padding:0 10px;outline:none;font-size:13px;font-family:inherit
  }
  .range-row{display:flex;align-items:center;gap:9px}
  .range-row input{min-width:0}
  .tilde{font-weight:900;color:#444}
  .toggle-row{display:flex;align-items:center;gap:12px;font-size:16px;color:#666;font-weight:700}
  .toggle-row input{appearance:none;width:21px;height:21px;border:1px solid #888;border-radius:6px;background:#fff;cursor:pointer;position:relative}
  .toggle-row input:checked{background:#536ae8;border-color:#536ae8}
  .toggle-row input:checked::after{content:"✓";position:absolute;left:3px;top:-3px;color:#fff;font-size:15px;font-weight:900}
  .time-help{margin-top:7px;font-size:10px;color:#777}
  @media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:1fr}}
  @media(max-width:600px){.grid-4{grid-template-columns:1fr}.card-head{flex-direction:column;gap:16px}}
</style>
{% endblock %}

{% block content %}
<div style="padding:40px 5vw 80px">
  <form method="post">
    {% csrf_token %}
    <div class="settings-card">
      <div class="card-head">
        <h1 class="tank-title">{{ tank.name }}</h1>
        <div class="head-actions">
          <a href="{% url 'monitoring:dashboard' tank.id %}">
            <button type="button" class="head-btn cancel-btn">취소</button>
          </a>
          <button type="submit" class="head-btn save-btn">설정 저장</button>
        </div>
      </div>

      <!-- 수질 기준값 -->
      <div class="section">
        <h2 class="section-title">수질 기준값</h2>
        <div class="grid-4">
          <div class="setting-box">
            <label>수온 범위 (°C)</label>
            <div class="range-row">
              <input type="number" name="temp_min" step="0.1" value="{{ tank.temp_min|default:'21.0' }}">
              <span class="tilde">~</span>
              <input type="number" name="temp_max" step="0.1" value="{{ tank.temp_max|default:'24.0' }}">
            </div>
          </div>
          <div class="setting-box">
            <label>PH 범위</label>
            <div class="range-row">
              <input type="number" name="ph_min" step="0.1" value="{{ tank.ph_min|default:'6.5' }}">
              <span class="tilde">~</span>
              <input type="number" name="ph_max" step="0.1" value="{{ tank.ph_max|default:'8.0' }}">
            </div>
          </div>
          <div class="setting-box">
            <label>DO 최소값 (mg/L)</label>
            <input type="number" name="do_min" step="0.1" value="{{ tank.do_min|default:'5.0' }}">
          </div>
          <div class="setting-box">
            <label>탁도 최대값 (NTU)</label>
            <input type="number" name="turbidity_max" step="0.1" value="{{ tank.turbidity_max|default:'50.0' }}">
          </div>
        </div>
      </div>

      <!-- 장치 임계값 -->
      <div class="section">
        <h2 class="section-title">장치 자동 제어 임계값</h2>
        <div class="grid-4">
          <div class="setting-box">
            <label>히터 ON/OFF (°C)</label>
            <div class="range-row">
              <input type="number" name="heater_on_temp" step="0.1" value="{{ tank.heater_on_temp|default:'21.0' }}" placeholder="ON">
              <span class="tilde">/</span>
              <input type="number" name="heater_off_temp" step="0.1" value="{{ tank.heater_off_temp|default:'22.0' }}" placeholder="OFF">
            </div>
          </div>
          <div class="setting-box">
            <label>냉각팬 ON/OFF (°C)</label>
            <div class="range-row">
              <input type="number" name="cooling_on_temp" step="0.1" value="{{ tank.cooling_on_temp|default:'24.0' }}" placeholder="ON">
              <span class="tilde">/</span>
              <input type="number" name="cooling_off_temp" step="0.1" value="{{ tank.cooling_off_temp|default:'23.0' }}" placeholder="OFF">
            </div>
          </div>
          <div class="setting-box">
            <label>에어펌프 DO (mg/L)</label>
            <div class="range-row">
              <input type="number" name="airpump_on_do" step="0.1" value="{{ tank.airpump_on_do|default:'4.0' }}" placeholder="ON">
              <span class="tilde">/</span>
              <input type="number" name="airpump_off_do" step="0.1" value="{{ tank.airpump_off_do|default:'6.0' }}" placeholder="OFF">
            </div>
          </div>
          <div class="setting-box">
            <label>여과기 탁도 (NTU)</label>
            <div class="range-row">
              <input type="number" name="filter_on_ntu" step="0.1" value="{{ tank.filter_on_ntu|default:'50.0' }}" placeholder="ON">
              <span class="tilde">/</span>
              <input type="number" name="filter_off_ntu" step="0.1" value="{{ tank.filter_off_ntu|default:'20.0' }}" placeholder="OFF">
            </div>
          </div>
        </div>
      </div>

      <!-- 급이 설정 -->
      <div class="section">
        <h2 class="section-title">급이 설정</h2>
        <div class="grid-3">
          <div class="setting-box">
            <label>자동 급이</label>
            <div class="toggle-row">
              <input type="checkbox" name="feeding_auto" id="autoFeed" {% if tank.feeding_auto %}checked{% endif %}>
              <span>자동 급이 사용</span>
            </div>
          </div>
          <div class="setting-box">
            <label>1회 급이량 (g)</label>
            <input type="number" name="feeding_amount_g" step="0.01" value="{{ tank.feeding_amount_g|default:'0.1' }}">
          </div>
          <div class="setting-box">
            <label>급이 시간</label>
            <input type="text" name="feeding_times" value="{{ tank.feeding_times|default:'08:00,18:00' }}" placeholder="예)08:00,18:00">
            <div class="time-help">쉼표로 구분 · 예) 08:00,12:00,18:00</div>
          </div>
        </div>
      </div>

      <!-- 조명 설정 -->
      <div class="section">
        <h2 class="section-title">조명 설정</h2>
        <div class="grid-3">
          <div class="setting-box">
            <label>자동 조명</label>
            <div class="toggle-row">
              <input type="checkbox" name="light_auto" id="autoLight" {% if tank.light_auto %}checked{% endif %}>
              <span>자동 조명 제어</span>
            </div>
          </div>
          <div class="setting-box">
            <label>점등 시각</label>
            <input type="number" name="light_on_hour" class="reg-input" min="0" max="23" value="{{ tank.light_on_hour|default:8 }}">
          </div>
          <div class="setting-box">
            <label>소등 시각</label>
            <input type="number" name="light_off_hour" class="reg-input" min="0" max="23" value="{{ tank.light_off_hour|default:20 }}">
          </div>
        </div>
      </div>

    </div>
  </form>
</div>
{% endblock %}
